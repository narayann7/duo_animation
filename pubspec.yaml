name: duo_animation
description: >-
  iPhone Duo style tilt-driven frosted-glass fold effect for any Flutter widget
  subtree. Device motion drives a fragment shader on Impeller.
version: 0.1.0
homepage: https://github.com/narayann7/duo_animation
repository: https://github.com/narayann7/duo_animation
issue_tracker: https://github.com/narayann7/duo_animation/issues

screenshots:
  - path: assets/screenshot-fold.webp
    description: An iPad tilted away from the hinge, the lifted half behind frosted glass.
  - path: assets/screenshot-rest.webp
    description: The same home screen at rest, where the effect is bypassed entirely.

topics:
  - animation
  - shader
  - sensors
  - impeller
  - duo

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^28.1.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.duoanimation.duo_animation
        pluginClass: DuoAnimationPlugin
      ios:
        pluginClass: DuoAnimationPlugin
  shaders:
    - shaders/duo_animation.frag
