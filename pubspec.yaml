name: duo_animation
description: iPhone Duo style tilt-driven frosted-glass fold effect for any Flutter widget subtree.
version: 0.1.0
repository: https://github.com/narayann7/duo_animation

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^28.1.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.duoanimation.duo_animation
        pluginClass: DuoAnimationPlugin
      ios:
        pluginClass: DuoAnimationPlugin
  shaders:
    - shaders/duo_animation.frag
